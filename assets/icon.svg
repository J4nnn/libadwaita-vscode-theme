<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e32" />
      <stop offset="100%" stop-color="#222226" />
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="20" y="20" width="216" height="216" rx="44" />
    </clipPath>
  </defs>

  <!-- Outer Card Shadow -->
  <rect x="20" y="24" width="216" height="216" rx="44" fill="#000006" fill-opacity="0.36" />

  <!-- LibAdwaita Window Surface -->
  <g clip-path="url(#windowClip)">
    <!-- Editor View Background (--view-bg-color #1d1d20) -->
    <rect x="20" y="20" width="216" height="216" fill="#1d1d20" />

    <!-- Secondary Sidebar (--secondary-sidebar-bg-color #28282c) -->
    <rect x="20" y="64" width="64" height="172" fill="#28282c" />
    <line x1="84" y1="64" x2="84" y2="236" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

    <!-- HeaderBar (--headerbar-bg-color #2e2e32) -->
    <rect x="20" y="20" width="216" height="44" fill="#2e2e32" />
    <line x1="20" y1="64" x2="236" y2="64" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

    <!-- Active Tab Indicator (--accent-bg-color #3584e4) -->
    <rect x="84" y="62" width="76" height="3" fill="#3584e4" />

    <!-- HeaderBar Pill / Search OmniBar -->
    <rect x="86" y="32" width="72" height="20" rx="10" fill="#ffffff" fill-opacity="0.10" />

    <!-- LibAdwaita Window Controls (Close Circle) -->
    <circle cx="212" cy="42" r="9" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="212" cy="42" r="4" fill="#deddda" />

    <!-- Sidebar Items -->
    <rect x="32" y="82" width="40" height="10" rx="5" fill="#3584e4" />
    <rect x="32" y="102" width="32" height="8" rx="4" fill="#ffffff" fill-opacity="0.30" />
    <rect x="32" y="118" width="36" height="8" rx="4" fill="#ffffff" fill-opacity="0.20" />
    <rect x="32" y="134" width="28" height="8" rx="4" fill="#ffffff" fill-opacity="0.20" />
    <rect x="32" y="150" width="38" height="8" rx="4" fill="#ffffff" fill-opacity="0.20" />

    <!-- Active Editor Line Highlight (#242428) -->
    <rect x="85" y="114" width="151" height="20" fill="#242428" />

    <!-- GtkSourceView 5 Adwaita-dark Code Tokens -->
    <!-- Line 1: Keyword (#ffa348) + Function (#62a0ea) -->
    <rect x="98" y="84" width="32" height="10" rx="5" fill="#ffa348" />
    <rect x="136" y="84" width="54" height="10" rx="5" fill="#62a0ea" />

    <!-- Line 2: Type (#5bc8af) + Identifier (#8ff0a4) -->
    <rect x="110" y="102" width="36" height="10" rx="5" fill="#5bc8af" />
    <rect x="152" y="102" width="48" height="10" rx="5" fill="#8ff0a4" />

    <!-- Line 3 (Active): Constant (#7d8ac7) + String (#5bc8af) -->
    <rect x="110" y="119" width="28" height="10" rx="5" fill="#7d8ac7" />
    <rect x="144" y="119" width="66" height="10" rx="5" fill="#5bc8af" />

    <!-- Line 4: Comment (#77767b) -->
    <rect x="110" y="138" width="76" height="10" rx="5" fill="#77767b" />

    <!-- Line 5: Special / Macro (#f66151) + Number (#7d8ac7) -->
    <rect x="110" y="156" width="42" height="10" rx="5" fill="#f66151" />
    <rect x="158" y="156" width="32" height="10" rx="5" fill="#7d8ac7" />

    <!-- Line 6: Return Keyword (#ffa348) -->
    <rect x="98" y="174" width="36" height="10" rx="5" fill="#ffa348" />

    <!-- GNOME Accent Palette Dots at Bottom -->
    <circle cx="106" cy="210" r="6" fill="#3584e4" />
    <circle cx="126" cy="210" r="6" fill="#33b2a4" />
    <circle cx="146" cy="210" r="6" fill="#2ec27e" />
    <circle cx="166" cy="210" r="6" fill="#f5c211" />
    <circle cx="186" cy="210" r="6" fill="#ff7800" />
    <circle cx="206" cy="210" r="6" fill="#e01b24" />
    <circle cx="222" cy="210" r="6" fill="#c061cb" />
  </g>

  <!-- Outer Window Border (--border-color 15% white) -->
  <rect x="20" y="20" width="216" height="216" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />
</svg>
